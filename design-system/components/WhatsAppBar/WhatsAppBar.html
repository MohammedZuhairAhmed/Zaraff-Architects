<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Zaraff — Sticky WhatsApp bar</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pad{padding:var(--space-xl) var(--gutter)}.band{padding:var(--space-xl) var(--gutter)}h1{margin:0 0 var(--space-sm)}.eyebrow{color:var(--body);margin:0 0 var(--space-xs)}.note{font-size:var(--fs-body-small);color:var(--body);max-width:64ch;margin:0 0 var(--space-lg)}.zf-light .note{color:var(--body-on-light)}h2{margin:0 0 var(--space-md)}.caption{font-size:var(--fs-body-small);color:var(--body);margin:var(--space-xs) 0 0}.phone{width:390px;flex:none}.phone__label{font-size:var(--fs-body-small);color:var(--body);margin:0 0 var(--space-xs)}.split{display:flex;gap:var(--gutter);align-items:flex-start;flex-wrap:wrap}.wide{flex:1;min-width:420px}.shell{width:390px;height:600px;border:var(--frame);position:relative;overflow:hidden;display:flex;flex-direction:column}.shell__scroll{flex:1;overflow-y:auto;padding:var(--space-sm)}.shell__bar{position:relative}.safe{height:22px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 1px,transparent 1px 7px);display:grid;place-items:center;font-size:12px;color:var(--body)}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { WhatsAppBar, WhatsAppBarSpacer, ProjectPlate } = window.ArchitectureStudioDesignSystem_04f6f4;

const Card = () => (
  <div className="pad">
    <p className="zf-label eyebrow">Domain</p>
    <h1 className="zf-display">Sticky WhatsApp bar</h1>
    <p className="note">The conversion action, held at the bottom of small screens. It is the one WhatsApp element on the view, so a page carrying this bar does not repeat the green button in its footer. Two things keep it from covering content: the spacer, which reserves the bar's height at the end of the page, and a bottom padding built from the safe-area inset, so the button clears the home indicator on a notched phone. From 760px the bar and its spacer both disappear and the action returns to the page.</p>
    <div className="split">
      <div>
        <p className="phone__label">390px — in place, page scrolled to the end</p>
        <div className="shell">
          <div className="shell__scroll">
            <div style={{ display: 'grid', gap: 'var(--space-lg)' }}>
              <ProjectPlate title="House at Kottayam" typology="Residence" area={2850} location="Kottayam, Kerala" year={2025} status="ongoing" statusLabel="Under construction" media={{ kind: 'render' }} />
              <div className="zf-body-small">The last block of the page sits above the bar, not under it, because the spacer below reserves its height.</div>
              <WhatsAppBarSpacer keepOnDesktop />
            </div>
          </div>
          <div className="shell__bar">
            <WhatsAppBar staticPosition context="House at Kottayam" phone="+919847012345" title="Ask about this project" subtitle="Reply within a working day" />
            <div className="safe">safe area inset</div>
          </div>
        </div>
      </div>
      <div className="wide">
        <p className="phone__label">The bar on its own</p>
        <WhatsAppBar staticPosition phone="+919847012345" />
        <p className="caption">Title truncates rather than wrapping, so the bar stays one row high at any label length.</p>
        <p className="phone__label" style={{ marginTop: 'var(--space-lg)' }}>With a project name — the message is pre-filled</p>
        <WhatsAppBar staticPosition context="the design and build package" title="Get a per-square-foot estimate" subtitle="Send your plot size and location" phone="+919847012345" label="Message us" />
        <p className="caption">context fills the wa.me text: “Hi Zaraff, I am enquiring about the design and build package.”</p>
      </div>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
