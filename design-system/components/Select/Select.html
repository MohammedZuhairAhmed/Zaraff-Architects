<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Zaraff — Select</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pad{padding:var(--space-xl) var(--gutter)}.band{padding:var(--space-xl) var(--gutter)}h1{margin:0 0 var(--space-sm)}.eyebrow{color:var(--body);margin:0 0 var(--space-xs)}.note{font-size:var(--fs-body-small);color:var(--body);max-width:64ch;margin:0 0 var(--space-lg)}.zf-light .note{color:var(--body-on-light)}h2{margin:0 0 var(--space-md)}.grid{display:grid;grid-template-columns:150px repeat(4,max-content);gap:var(--space-md) var(--space-lg);align-items:center;justify-content:start}.colhead{font-size:12px;color:var(--body);font-weight:500}.zf-light .colhead{color:var(--body-on-light)}.rowlabel{font-size:var(--fs-label);font-weight:500;color:var(--on-dark)}.zf-light .rowlabel{color:var(--ink)}.stack{display:grid;gap:var(--space-lg)}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gutter)}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Select } = window.ArchitectureStudioDesignSystem_04f6f4;
const R = React;

const typologies = ['Residence', 'Villa', 'Apartment interior', 'Commercial'];
const Specimen = () => (
  <div className="cols">
    <div className="stack">
      <Select label="Typology" options={typologies} placeholder="Select a typology" />
      <Select label="Budget range" options={['Under 30 lakh', '30 to 60 lakh', '60 lakh and above']} hint="Ranges only. We firm this up after the first site visit." />
      <Select label="Hover" className="hoverdemo" options={typologies} />
    </div>
    <div className="stack">
      <Select label="Focus visible" className="focusdemo" options={typologies} />
      <Select label="Error" options={typologies} placeholder="Select a typology" error="Choose a typology so we can send the right package." />
      <Select label="Disabled" options={['Design and build']} disabled />
    </div>
  </div>
);
const Card = () => {
  React.useEffect(() => {
    document.querySelectorAll('.hoverdemo .zf-select').forEach((n) => n.classList.add('is-hover'));
    document.querySelectorAll('.focusdemo .zf-select').forEach((n) => n.classList.add('is-focus'));
  });
  return (
    <>
      <div className="pad">
        <p className="zf-label eyebrow">Components</p>
        <h1 className="zf-display">Select</h1>
        <p className="note">The native control, restyled to the same baseline rule as Input. The caret is a rotated square — the only ornament — and stays out of the hit area.</p>
        <Specimen />
      </div>
      <div className="band zf-light">
        <h2 className="zf-heading">On the light band</h2>
        <Specimen />
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
