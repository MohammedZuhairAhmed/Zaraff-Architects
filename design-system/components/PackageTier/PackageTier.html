<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Zaraff — Package tier</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.pad{padding:var(--space-xl) var(--gutter)}.band{padding:var(--space-xl) var(--gutter)}h1{margin:0 0 var(--space-sm)}.eyebrow{color:var(--body);margin:0 0 var(--space-xs)}.note{font-size:var(--fs-body-small);color:var(--body);max-width:64ch;margin:0 0 var(--space-lg)}.zf-light .note{color:var(--body-on-light)}h2{margin:0 0 var(--space-md)}.caption{font-size:var(--fs-body-small);color:var(--body);margin:var(--space-xs) 0 0}.phone{width:390px;flex:none}.phone__label{font-size:var(--fs-body-small);color:var(--body);margin:0 0 var(--space-xs)}.split{display:flex;gap:var(--gutter);align-items:flex-start;flex-wrap:wrap}.wide{flex:1;min-width:420px}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { PackageComparison } = window.ArchitectureStudioDesignSystem_04f6f4;

const tiers = [
  {
    name: 'Design and drawings',
    rate: '₹95',
    basis: 'per square foot',
    summary: 'You hold the drawings and appoint your own contractor.',
    includes: ['Site study and a measured plot survey', 'Floor plans, elevations and sections', 'The municipal sanction set', 'Structural and electrical drawings', 'Two revisions at each stage'],
    excludes: ['Construction and site supervision', 'Material procurement', 'Interior furniture and loose pieces'],
  },
  {
    name: 'Design and build',
    rate: '₹1,850',
    basis: 'per square foot, turnkey',
    summary: 'One drawing set, one team, from sanction to handover.',
    emphasis: true,
    includes: ['Everything in design and drawings', 'Construction with our own site team', 'Material procurement at our rates', 'Weekly progress reporting on WhatsApp', 'Fixed interiors — kitchen, wardrobes, vanities', 'One year of defect liability after handover'],
    excludes: ['Land cost and statutory fees', 'Loose furniture and soft furnishing', 'Landscaping beyond the plinth'],
  },
];

const Card = () => (
  <>
    <div className="pad">
      <p className="zf-label eyebrow">Domain</p>
      <h1 className="zf-display">Package tier</h1>
      <p className="note">Homeowners compare these literally, line against line, so the two tiers carry the same headings in the same order: name, basis, what it includes, what it excludes, then the WhatsApp action with the tier name already in the message. On a phone the tiers stack rather than turning into a scrolling matrix — a row of prices you have to swipe to read is a row of prices nobody reads. Each tier keeps its own labels so the comparison still works after a scroll.</p>
      <div className="split">
        <div className="phone">
          <p className="phone__label">390px — stacked, in reading order</p>
          <PackageComparison tiers={tiers} phone="+919847012345" className="zf-packages--stacked" />
        </div>
        <div className="wide">
          <p className="phone__label">From 760px — two columns</p>
          <PackageComparison tiers={tiers} phone="+919847012345" />
          <p className="caption">One tier may take the red oxide border. The lump-sum case reads the same way: pass rate "₹42 lakh" with basis "lump sum".</p>
        </div>
      </div>
    </div>
    <div className="band zf-light">
      <h2 className="zf-heading">On the light band</h2>
      <p className="note">Pricing lives on the light band, which is where this component will usually sit.</p>
      <PackageComparison tiers={tiers} phone="+919847012345" />
    </div>
  </>
);

ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
